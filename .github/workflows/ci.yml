# -----------------------------------------------------------------------------
# CI — gate obligatorio antes de cualquier fusión en `main`.
#
# Corre en `push` a `main` y en cada `pull_request`. Si cualquiera de estos
# jobs falla, la rama no debe fusionarse (regla 6 de AGENTS.md).
#
# Cubre, en paralelo:
#   * rust: cargo fmt + cargo clippy (-D warnings) con todas las features y con
#     `--no-default-features` (ruta sin webview), y cargo test --all-features.
#   * desktop: TypeScript strict (tsc) + build de Vite (npm run build).
#   * mobile: TypeScript typecheck (npm run typecheck).
#
# Nota: en GH Actions instalamos libwebkit2gtk-4.1, así que `--all-features`
# (webview + onnx) es el gate estricto de producción; el job adicional con
# `--no-default-features` protege la ruta que compila en máquinas sin webkit.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libasound2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features) — gate estricto de producción
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (sin webview) — ruta sin webkit
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Test (all features)
        run: cargo test --workspace --all-features

  desktop:
    name: Desktop (TS + Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: TypeScript + Vite build
        working-directory: desktop
        run: npm run build

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript typecheck
        working-directory: mobile
        run: npm run typecheck
