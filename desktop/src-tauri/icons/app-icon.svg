<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fondo: carbón -->
  <rect width="1024" height="1024" rx="220" fill="#0B0D0F"/>
  <!-- Anillo exterior grafito -->
  <circle cx="512" cy="512" r="430" fill="#16181C" stroke="#2A2E34" stroke-width="18"/>
  <!-- Dial interior -->
  <circle cx="512" cy="512" r="330" fill="#0E1113" stroke="#1E2228" stroke-width="8"/>
  <!-- Marcas del instrumento -->
  <g stroke="#3A4149" stroke-width="20" stroke-linecap="round">
    <line x1="512" y1="222" x2="512" y2="262"/>
    <line x1="716" y1="308" x2="688" y2="336"/>
    <line x1="802" y1="512" x2="762" y2="512"/>
  </g>
  <!-- Arco de acento cian (espectro) -->
  <path d="M 262 512 A 250 250 0 0 1 762 512" fill="none" stroke="#4FD8FF" stroke-width="26" stroke-linecap="round" opacity="0.9"/>
  <!-- Aguja naranja LFA -->
  <g transform="rotate(48 512 512)">
    <polygon points="512,512 488,288 536,288 512,512" fill="#FF4A1F"/>
    <circle cx="512" cy="512" r="42" fill="#FF4A1F"/>
    <circle cx="512" cy="512" r="20" fill="#0B0D0F"/>
  </g>
  <!-- Hub central -->
  <circle cx="512" cy="512" r="60" fill="#16181C" stroke="#FF4A1F" stroke-width="8"/>
</svg>
