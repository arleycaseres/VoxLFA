# -----------------------------------------------------------------------------
# voxlfa-desktop — Cáscara de escritorio (Tauri v2) de VoxLFA
#
# Este crate es la app nativa de escritorio. Su responsabilidad es orquestar:
#   * El motor de audio del core (`voxlfa-core`, feature `audio`).
#   * La UI (frontend React servido por Tauri).
#   * El canal WebSocket de monitoreo remoto para la app móvil.
# NO contiene lógica de audio/DSP: eso vive en `voxlfa-core`.
#
# Features:
#   * `webview` (default): integración completa con Tauri (ventana + UI).
#     Requiere las librerías de webview del sistema (webkit2gtk-4.1 en Linux).
#   * sin `webview`: compila solo el "shell" de backend (emparejamiento,
#     WebSocket y gestión del motor). Permite testear la lógica sin Tauri.
# -----------------------------------------------------------------------------
[package]
name = "voxlfa-desktop"
description = "VoxLFA — procesador vocal en vivo con IA (app de escritorio)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "voxlfa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["webview"]
webview = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
voxlfa-core = { path = "../../core", features = ["audio", "rnnoise", "onnx"] }

tauri = { version = "2", features = [], optional = true }

# Canal WebSocket para el monitoreo remoto desde la app móvil.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
url = "2"
rand = "0.8"
local-ip-address = "0.6"

# Autodetección por mDNS: publica `_voxlfa._tcp.local` en la red local para
# que el móvil (u otras herramientas) encuentren el escritorio.
mdns-sd = { version = "0.21", features = ["async", "log", "logging"] }

# Envío HTTP de telemetría (solo eventos anónimos, opt-in).
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Utilities
log = "0.4"
once_cell = "1.20"
dotenvy = "0.15"
