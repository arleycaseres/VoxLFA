# -----------------------------------------------------------------------------
# voxlfa-core — Motor DSP + IA de VoxLFA
#
# Es la biblioteca compartida ("el cerebro") que se reutiliza en todas las
# plataformas. Reglas de diseño:
#   * NO depende de la UI ni de Tauri.
#   * El procesamiento de audio es puro (sin I/O) y está en `dsp/`.
#   * La captura/salida de audio (cpal) es opcional y vive detrás del feature
#     `audio`, que solo habilita el escritorio.
#   * El contrato de datos con la UI y el móvil vive en `protocol/` (serde).
#
# Se compila como `rlib` (para el desktop) y `cdylib` (para exponer FFI a
# otras plataformas en el futuro).
# -----------------------------------------------------------------------------
[package]
name = "voxlfa-core"
description = "Motor DSP + IA de VoxLFA, compartido entre desktop y móvil."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords = ["audio", "dsp", "voxlfa", "realtime", "machine-learning"]
categories = ["multimedia::audio"]
publish = false

[lib]
name = "voxlfa_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Habilita el motor de audio en tiempo real (captura → procesado → salida)
# basado en cpal y el buffer de anillo lock-free.
audio = ["dep:cpal", "dep:ringbuf"]
# Supresión de ruido con RNNoise (nnnoiseless, puro Rust, modelo embebido).
rnnoise = ["dep:nnnoiseless"]
# Supresión de ruido con ONNX Runtime + DeepFilterNet3 (mejor calidad, más
# peso). Requiere descargar binarios de ONNX Runtime en la primera compilación.
onnx = ["dep:ort", "dep:ndarray", "dep:ureq"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustfft.workspace = true

cpal = { version = "0.16", optional = true, features = ["jack"] }
ringbuf = { version = "0.4", optional = true }
nnnoiseless = { version = "0.5", optional = true }
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"], optional = true }
ndarray = { version = "0.15", optional = true }
ureq = { version = "3", optional = true }
